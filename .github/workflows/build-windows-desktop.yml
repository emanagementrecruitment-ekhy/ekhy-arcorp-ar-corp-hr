name: Build Desktop App (Windows installer)

on:
  workflow_dispatch:
    inputs:
      client_name:
        description: "Nama client, mis. Bintang Management (kosong = AR Corp). Nama aplikasi, judul jendela, appId, shortcut dan nama installer dibuat otomatis dari sini."
        required: false
        default: ""
      server_url:
        description: "Alamat server Railway client, mis. https://bintang-management-hr-production.up.railway.app (kosong = server AR Corp)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/build-windows-desktop.yml"

jobs:
  build:
    # Runs on a real Windows machine — no wine, no cross-compile risk. The
    # local build-desktop.sh (see desktop/) is reused as-is via Git Bash,
    # which ships on GitHub's windows-latest runners.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root app dependencies
        run: npm ci

      - name: Build app + template database + Windows installer
        shell: bash
        env:
          DESKTOP_CLIENT_NAME: ${{ inputs.client_name }}
          DESKTOP_SERVER_URL: ${{ inputs.server_url }}
        run: bash desktop/build-desktop.sh

      - name: Read generated client identity
        # build-desktop.sh generated desktop/client.json from the client name
        # (see desktop/client-config.js), so nothing is hand-edited per client.
        id: product
        shell: bash
        run: |
          node -e '
            const c = require("./desktop/client.json");
            const out = [`name=${c.productName}`, `slug=${c.slug}`, `installer=${c.installerName}`, `default=${c.slug === "ar-corp"}`];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out.join("\n") + "\n");
          '

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-installer-${{ steps.product.outputs.slug }}-${{ github.run_number }}
          path: desktop/dist/*.exe
          retention-days: 90

      - name: Publish as a GitHub Release (stable download link)
        # Release assets don't touch git history the way a committed binary
        # would (see build-android.yml, which commits the much smaller APK
        # straight into public/downloads/) — this installer is far too big
        # for that (GitHub blocks pushes with files over 100MB), and Release
        # assets give a stable, ever-current URL on their own:
        # https://github.com/<owner>/<repo>/releases/latest/download/<slug>-Setup.exe
        #
        # Each build gets its OWN tag (desktop-<run number>) instead of
        # reusing/deleting "desktop-latest" — repos with GitHub's "immutable
        # releases" repo rule enabled permanently block re-creating a release
        # under a tag name that was ever published before, even after
        # deleting it (HTTP 422 "tag_name was used by an immutable release").
        # --latest still moves the stable /releases/latest/ alias to this
        # run's release regardless of its tag name, so the download link on
        # the login page (which points at /releases/latest/download/<file>)
        # never needs to change.
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          installer=$(ls desktop/dist/*.exe)
          exeName="${{ steps.product.outputs.installer }}"
          cp "$installer" "$exeName"
          # Only the default (AR Corp) build moves the /releases/latest/ alias;
          # a client build must never replace AR Corp's stable download link.
          if [ "${{ steps.product.outputs.default }}" = "true" ]; then
            tag="desktop-${{ github.run_number }}"; latest="--latest"
          else
            tag="desktop-${{ steps.product.outputs.slug }}-${{ github.run_number }}"; latest="--latest=false"
          fi
          gh release create "$tag" "$exeName" \
            --title "${{ steps.product.outputs.name }} — installer terbaru" \
            --notes "Dibuat otomatis dari commit ${{ github.sha }} (build #${{ github.run_number }}). Unduh dan jalankan langsung di komputer/laptop Windows kantor." \
            $latest
          url="https://github.com/${{ github.repository }}/releases/download/$tag/$(basename "$exeName")"
          echo "Link unduhan installer: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "Isi NEXT_PUBLIC_DOWNLOAD_DESKTOP di Railway client dengan link di atas." >> "$GITHUB_STEP_SUMMARY"
