name: Build Android App (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.1.0"

      - name: Bridge Android SDK layout for Bubblewrap compatibility
        # Bubblewrap's SDK path check (and its own sdkmanager calls) look for a
        # legacy `$ANDROID_HOME/tools/bin` folder, which modern cmdline-tools-only
        # SDK installs (like the one above) no longer have — only `cmdline-tools/latest/bin`.
        run: ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Restore signing keystore
        working-directory: android
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Point Bubblewrap at the JDK/Android SDK installed above
        # `bubblewrap updateConfig` always goes through Bubblewrap's interactive
        # first-run wizard first (it re-checks its own ~/.bubblewrap/config.json
        # on every invocation, prompt included, regardless of the subcommand or
        # flags passed) — which hangs forever with no TTY in CI. Writing the
        # config file directly skips that wizard entirely.
        run: |
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          cat "$HOME/.bubblewrap/config.json"

      - name: Generate the Android project from twa-manifest.json
        # Every CI run starts from a clean checkout, so the Gradle project
        # (gradlew, app/, etc.) never exists yet — it must be generated fresh
        # every time via `update`, not left for `build` to do implicitly.
        # `build` only regenerates the project when it thinks the manifest
        # changed (comparing against manifest-checksum.txt); `update` also
        # writes that checksum file itself, so the immediately-following
        # `build` step correctly sees the project as already up to date and
        # skips straight to compiling instead of hitting its own interactive
        # "no checksum file found, regenerate?" prompt (which hangs with no
        # TTY in CI). --skipVersionUpgrade avoids the only other prompt in
        # this command (bumping appVersionCode/appVersionName).
        working-directory: android
        run: bubblewrap update --skipVersionUpgrade 2>&1 | tee update-output.log

      - name: Build signed App Bundle + APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation 2>&1 | tee build-output.log

      - name: List generated files (debug)
        if: always()
        working-directory: android
        run: find . -maxdepth 4 \( -iname "*.aab" -o -iname "*.apk" \) -o -maxdepth 1 -type f | sort

      # TEMPORARY debug aid: artifact downloads and raw log storage are both
      # unreachable from where these workflow files are authored, so the
      # captured output is pushed to a throwaway branch instead (plain git
      # push, which is reachable) purely so it can be read back. Remove once
      # the build is confirmed producing the right files.
      - name: Push build log to debug branch
        if: always()
        run: |
          git config user.email "ci@dearmanagement.local"
          git config user.name "CI Debug"
          git checkout --orphan ci-debug-log
          git rm -rf --cached . > /dev/null
          mkdir -p debug
          cp android/update-output.log debug/update-output.log 2>/dev/null || echo "no log file" > debug/update-output.log
          cp android/build-output.log debug/build-output.log 2>/dev/null || echo "no log file" > debug/build-output.log
          find android -maxdepth 4 -type f \( -iname "*.aab" -o -iname "*.apk" \) > debug/found-files.txt 2>&1 || true
          ls -la android > debug/android-dir-listing.txt 2>&1 || true
          git add debug/
          git commit -m "debug: build-output.log"
          git push -f origin ci-debug-log

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dear-management-android-${{ github.run_number }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 90
